experiment:
  name: fiqa-hybrid-qwen-v1
  description: >
    Working-RAG comparison: hybrid BM25+dense retrieval (top-5) +
    Qwen2.5-3B-Instruct on the same 100-query slice. Third point of the
    answer-grounding vs retrieval-strategy comparison.

dataset:
  name: fiqa
  version: "1.0"
  path: datasets/downloads/fiqa

retrieval:
  method: hybrid
  top_k: 5
  params:
    dense_weight: 0.5
    bm25:
      k1: 1.5
      b: 0.75
    dense:
      embedding: sentence-transformers/all-MiniLM-L6-v2

generator:
  model: Qwen/Qwen2.5-3B-Instruct
  max_new_tokens: 200
  temperature: 0.0
  limit: 100
  max_context_chars: 3000

models:
  embedding: sentence-transformers/all-MiniLM-L6-v2

parameters:
  seed: 42

evaluation:
  metrics:
    - recall_at_5
    - recall_at_10
    - precision_at_10
    - mrr_at_10
    - ndcg_at_10
  k_values: [5, 10]
