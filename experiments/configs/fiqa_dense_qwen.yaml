experiment:
  name: fiqa-dense-qwen-v1
  description: >
    Working-RAG comparison: dense retrieval (top-5, MiniLM) + Qwen2.5-3B-Instruct
    on the same 100-query slice as fiqa-bm25-qwen-v1. Tests whether better
    retrieval improves answer grounding.

dataset:
  name: fiqa
  version: "1.0"
  path: datasets/downloads/fiqa

retrieval:
  method: dense
  top_k: 5
  params: {}

generator:
  model: Qwen/Qwen2.5-3B-Instruct
  max_new_tokens: 200
  temperature: 0.0
  limit: 100
  max_context_chars: 3000

models:
  embedding: sentence-transformers/all-MiniLM-L6-v2

parameters:
  seed: 42

evaluation:
  metrics:
    - recall_at_5
    - recall_at_10
    - precision_at_10
    - mrr_at_10
    - ndcg_at_10
  k_values: [5, 10]
