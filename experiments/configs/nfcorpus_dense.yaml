experiment:
  name: nfcorpus-dense-v1
  description: >
    Phase 5 / H4: dense retrieval (all-MiniLM-L6-v2) on NFCorpus.
    Second domain for routing comparison.

dataset:
  name: nfcorpus
  version: "1.0"
  path: datasets/downloads/nfcorpus

retrieval:
  method: dense
  top_k: 10
  params: {}

models:
  embedding: sentence-transformers/all-MiniLM-L6-v2

parameters:
  seed: 42

evaluation:
  metrics:
    - recall_at_5
    - recall_at_10
    - precision_at_10
    - mrr_at_10
    - ndcg_at_10
  k_values: [5, 10]
