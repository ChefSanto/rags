experiment:
  name: fiqa-hybrid-v1
  description: >
    Phase 4 baseline: hybrid BM25+dense fusion on FiQA.
    Canonical run on Kaggle GPU.

dataset:
  name: fiqa
  version: "1.0"
  path: datasets/downloads/fiqa

retrieval:
  method: hybrid
  top_k: 10
  params:
    dense_weight: 0.5
    bm25:
      k1: 1.5
      b: 0.75
    dense:
      embedding: sentence-transformers/all-MiniLM-L6-v2

models:
  embedding: sentence-transformers/all-MiniLM-L6-v2

parameters:
  seed: 42

evaluation:
  metrics:
    - recall_at_5
    - recall_at_10
    - precision_at_10
    - mrr_at_10
    - ndcg_at_10
  k_values: [5, 10]
