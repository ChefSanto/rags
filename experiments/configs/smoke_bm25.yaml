experiment:
  name: smoke-bm25-v1
  description: >
    Smoke test of the experiment runner: BM25 on the synthetic dataset.
    Verifies config -> retrieval -> metrics -> result JSON end-to-end.

dataset:
  name: synthetic-smoke
  version: "1.0"
  path: datasets/synthetic-smoke

retrieval:
  method: bm25
  top_k: 10
  params:
    k1: 1.5
    b: 0.75

models:
  embedding: null

parameters:
  seed: 42

evaluation:
  metrics:
    - recall_at_5
    - recall_at_10
    - precision_at_10
    - mrr_at_10
    - ndcg_at_10
  k_values: [5, 10]
