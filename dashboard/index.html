<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Lab — RAG console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --fg:#e6e9ef; --dim:#9aa3b2; --accent:#5b9dff; --ok:#4ade80; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 24px; border-bottom:1px solid #262b36; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .dim { color:var(--dim); font-size:13px; }
  nav { display:flex; gap:8px; padding:10px 24px 0; flex-wrap:wrap; }
  nav button { background:var(--panel); color:var(--dim); border:1px solid #262b36; padding:8px 16px; border-radius:8px 8px 0 0; cursor:pointer; }
  nav button.active { color:var(--fg); border-bottom-color:var(--accent); }
  main { padding:16px 24px; }
  section { display:none; }
  section.active { display:block; }
  .panel { background:var(--panel); border:1px solid #262b36; border-radius:12px; padding:18px; }
  input[type=text], input[type=password], input:not([type]), textarea { width:100%; background:#0c0e12; color:var(--fg); border:1px solid #2c3340; border-radius:8px; padding:10px; font:inherit; }
  button.go { background:var(--accent); color:#08111f; border:0; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; }
  button.ghost { background:#232936; color:var(--fg); border:1px solid #2c3340; border-radius:8px; padding:10px 18px; cursor:pointer; }
  .meta { color:var(--dim); font-size:12px; margin-top:8px; }
  .err { color:#ff7b72; }
  .drop { border:2px dashed #2c3340; border-radius:12px; padding:30px; text-align:center; color:var(--dim); margin-top:6px; }
  .drop.over { border-color:var(--accent); color:var(--fg); }
  #ingestKeyRow { max-width:420px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid #232834; vertical-align:top; }
  th { color:var(--dim); font-weight:600; }
  td.num { font-variant-numeric:tabular-nums; }
  a { color:var(--accent); }

  /* chat */
  .chatwrap { display:flex; gap:16px; min-height:60vh; }
  .sidebar { width:250px; flex-shrink:0; display:flex; flex-direction:column; gap:8px; }
  .chatmain { flex:1; display:flex; flex-direction:column; }
  .chatlist { overflow-y:auto; flex:1; }
  .chatitem { padding:9px 12px; border-radius:8px; cursor:pointer; color:var(--dim); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chatitem:hover { background:#1d222c; }
  .chatitem.active { background:#223047; color:var(--fg); }
  .msgs { flex:1; overflow-y:auto; padding:8px 4px; max-height:56vh; }
  .msg { margin:10px 0; display:flex; flex-direction:column; }
  .bubble { max-width:82%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; }
  .msg.user { align-items:flex-end; }
  .msg.user .bubble { background:#223047; border-bottom-right-radius:4px; }
  .msg.bot { align-items:flex-start; }
  .msg.bot .bubble { background:#0c0e12; border:1px solid #232936; border-bottom-left-radius:4px; }
  .src { font-size:12px; color:var(--dim); border-left:2px solid #2c3340; padding-left:10px; margin:8px 0 0 4px; }
  .src .score { color:var(--ok); }
  .composer { display:flex; gap:8px; margin-top:12px; }
  .composer button { flex-shrink:0; }
</style>
</head>
<body>
<header>
  <h1>AI Lab</h1>
  <span class="dim">working RAG &middot; worker: <a id="workerUrl" href="#" target="_blank"></a></span>
</header>
<nav>
  <button data-tab="chats" class="active">Chats</button>
  <button data-tab="upload">Upload docs</button>
  <button data-tab="logs">Query log</button>
  <button data-tab="lab">Lab status</button>
</nav>
<main>
  <section id="chats" class="active">
    <div class="panel chatwrap">
      <div class="sidebar">
        <button class="go" onclick="newChat()">+ New chat</button>
        <div class="chatlist" id="chatList"><div class="meta">loading…</div></div>
      </div>
      <div class="chatmain">
        <div class="msgs" id="msgs"></div>
        <div class="composer">
          <input type="text" id="chatIn" placeholder="Ask about your documents or the corpus…" onkeydown="if(event.key==='Enter')send()">
          <button class="go" onclick="send()">Send</button>
        </div>
      </div>
    </div>
  </section>
  <section id="upload">
    <div class="panel">
      <div id="ingestKeyRow">
        <span class="dim">Ingest key (asked once, stored in this browser only):</span>
        <input type="password" id="ingestKey" placeholder="your ingest passphrase">
        <button class="ghost" onclick="localStorage.setItem('ingestKey', document.getElementById('ingestKey').value); up('ingest key saved')">Save key</button>
      </div>
      <div class="drop" id="drop">Drop PDF(s) here (or click to choose)</div>
      <input type="file" id="filePick" accept="application/pdf" multiple style="display:none">
      <div class="meta" style="margin-top:14px">…or paste text directly:</div>
      <textarea id="paste" rows="5" placeholder="Paste any text: notes, an article, meeting minutes…"></textarea>
      <input type="text" id="pasteName" placeholder="Name for this document (e.g. meeting-notes)" style="margin-top:8px">
      <button class="go" onclick="uploadPaste()">Upload pasted text</button>
      <div id="upOut"></div>
    </div>
  </section>
  <section id="logs">
    <div class="panel">
      <button class="go" onclick="loadLogs()">Refresh</button>
      <div id="logsOut"></div>
    </div>
  </section>
  <section id="lab">
    <div class="panel">
      <span class="dim">Loaded live from the GitHub repo (experiments/results). <button class="go" onclick="loadLab()">Reload</button></span>
      <div id="labOut"></div>
    </div>
  </section>
</main>
<script>
const WORKER = "https://ai-lab-worker.antwibrand.workers.dev";
const GH_API = "https://api.github.com/repos/ChefSanto/rags/contents/experiments/results";
document.getElementById("workerUrl").textContent = WORKER;
document.getElementById("workerUrl").href = WORKER + "/health";
document.getElementById("ingestKey").value = localStorage.getItem("ingestKey") || "";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

for (const b of document.querySelectorAll("nav button")) {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll("section").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById(b.dataset.tab).classList.add("active");
    if (b.dataset.tab === "logs") loadLogs();
    if (b.dataset.tab === "lab") loadLab();
    if (b.dataset.tab === "chats") { loadChats(); }
  };
}

function up(m) { document.getElementById("upOut").innerHTML = '<div class="meta">' + escapeHtml(m) + '</div>'; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------- chats ---------- */
let currentChat = null;
let busy = false;

async function loadChats() {
  try {
    const j = await (await fetch(WORKER + "/chats")).json();
    const list = document.getElementById("chatList");
    if (!j.chats || !j.chats.length) {
      list.innerHTML = '<div class="meta">No chats yet — ask something to start one.</div>';
      return;
    }
    list.innerHTML = "";
    for (const c of j.chats) {
      const d = document.createElement("div");
      d.className = "chatitem" + (c.id === currentChat ? " active" : "");
      d.textContent = c.title;
      d.title = c.title;
      d.onclick = () => openChat(c.id);
      list.appendChild(d);
    }
  } catch (e) {
    document.getElementById("chatList").innerHTML = '<div class="meta err">' + escapeHtml(String(e)) + '</div>';
  }
}

function newChat() {
  currentChat = null;
  document.getElementById("msgs").innerHTML = "";
  document.querySelectorAll(".chatitem").forEach(x => x.classList.remove("active"));
  document.getElementById("chatIn").focus();
}

async function openChat(id) {
  try {
    const j = await (await fetch(WORKER + "/chat?id=" + encodeURIComponent(id))).json();
    currentChat = id;
    renderMessages(j.messages || []);
    document.querySelectorAll(".chatitem").forEach(x => x.classList.toggle("active", x.textContent === j.chat.title));
  } catch (e) {
    alert("failed to load chat: " + e);
  }
}

function renderMessages(messages) {
  const box = document.getElementById("msgs");
  box.innerHTML = "";
  for (const m of messages) appendMsg(m.role, m.content, []);
  scrollBottom();
}

function appendMsg(role, content, sources) {
  const box = document.getElementById("msgs");
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "bot");
  let html = '<div class="bubble">' + escapeHtml(content) + '</div>';
  for (const s of sources) {
    html += '<div class="src"><span class="score">' + (s.score ?? 0).toFixed(3) + '</span> ' +
            '#' + escapeHtml(String(s.id)) + ' — ' + escapeHtml(s.preview) + '…</div>';
  }
  wrap.innerHTML = html;
  box.appendChild(wrap);
  scrollBottom();
}

function scrollBottom() {
  const box = document.getElementById("msgs");
  box.scrollTop = box.scrollHeight;
}

async function send() {
  const input = document.getElementById("chatIn");
  const message = input.value.trim();
  if (!message || busy) return;
  busy = true;
  input.value = "";
  appendMsg("user", message, []);
  appendMsg("bot", "thinking…", []);
  const thinking = document.getElementById("msgs").lastChild;
  try {
    const r = await fetch(WORKER + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: currentChat, message }),
    });
    const j = await r.json();
    if (!r.ok) { thinking.querySelector(".bubble").textContent = "Error: " + (j.error || r.status); return; }
    currentChat = j.chat_id;
    thinking.querySelector(".bubble").textContent = j.answer;
    let srcs = "";
    for (const s of j.sources) {
      srcs += '<div class="src"><span class="score">' + (s.score ?? 0).toFixed(3) + '</span> ' +
              '#' + escapeHtml(String(s.id)) + ' — ' + escapeHtml(s.preview) + '…</div>';
    }
    thinking.insertAdjacentHTML("beforeend", srcs);
    loadChats();
  } catch (e) {
    thinking.querySelector(".bubble").textContent = "Fetch failed: " + e;
  } finally {
    busy = false;
    input.focus();
  }
}

/* ---------- upload (multi-file) ---------- */
const drop = document.getElementById("drop");
drop.onclick = () => document.getElementById("filePick").click();
document.getElementById("filePick").onchange = (e) => handleFiles([...e.target.files]);
["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handleFiles([...e.dataTransfer.files]));

async function handleFiles(files) {
  for (const f of files) await handleFile(f);
}

function chunkText(text, size, overlap) {
  size = size || 1000; overlap = overlap || 200;
  text = text.replace(/\s+/g, " ").trim();
  if (!text) return [];
  const chunks = [];
  let start = 0;
  while (start < text.length) {
    let end = Math.min(start + size, text.length);
    if (end < text.length) {
      const b = text.lastIndexOf(" ", end);
      if (b > start + size / 2) end = b;
    }
    chunks.push(text.slice(start, end).trim());
    if (end === text.length) break;
    start = end - overlap;
  }
  return chunks.filter(c => c.length > 40);
}

async function handleFile(file) {
  try {
    up("extracting " + file.name + "…");
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const segments = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const t = tc.items.map(i => i.str).join(" ");
      if (t.trim()) segments.push({ seg: "p" + (p - 1), text: t });
      up("extracting " + file.name + "… page " + p + "/" + pdf.numPages);
    }
    const base = file.name.replace(/\.pdf$/i, "");
    await sendChunks(base, segments);
  } catch (e) {
    up("failed on " + file.name + ": " + e.message + " (text-based PDFs only for now)");
  }
}

async function uploadPaste() {
  const text = document.getElementById("paste").value;
  const name = document.getElementById("pasteName").value.trim() || "pasted-text";
  if (!text.trim()) return;
  await sendChunks(name.replace(/[^\w.-]+/g, "-"), [{ seg: "t0", text }]);
}

async function sendChunks(base, segments) {
  const key = localStorage.getItem("ingestKey") || "";
  const all = [];
  for (const s of segments) {
    chunkText(s.text).forEach((c, j) =>
      all.push({ id: (base + "-" + s.seg + "-c" + j).slice(0, 200), text: c }));
  }
  if (!all.length) { up("no usable text found"); return; }
  let done = 0;
  for (let i = 0; i < all.length; i += 500) {
    const part = all.slice(i, i + 500);
    const r = await fetch(WORKER + "/ingest-text", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Ingest-Key": key },
      body: JSON.stringify({ chunks: part }),
    });
    const j = await r.json();
    if (!r.ok) { up("upload failed: " + (j.error || r.status)); return; }
    done += part.length;
    up("uploading " + base + "… " + done + "/" + all.length);
  }
  up("done — " + base + ": " + done + " chunks uploaded.");
}

/* ---------- logs ---------- */
async function loadLogs() {
  const outEl = document.getElementById("logsOut");
  outEl.innerHTML = '<div class="meta">loading…</div>';
  try {
    const r = await fetch(WORKER + "/logs?limit=50");
    const j = await r.json();
    if (!j.logs || !j.logs.length) { outEl.innerHTML = '<div class="meta">No queries logged yet.</div>'; return; }
    let html = '<table><tr><th>#</th><th>when (UTC)</th><th>question</th><th>src</th><th>ms</th></tr>';
    for (const l of j.logs) {
      html += '<tr><td>' + l.id + '</td><td class="dim">' + l.created_at + '</td><td>' +
              escapeHtml(l.question) + '</td><td class="num">' + l.num_sources +
              '</td><td class="num">' + l.elapsed_ms + '</td></tr>';
    }
    outEl.innerHTML = html + '</table>';
  } catch (e) {
    outEl.innerHTML = '<div class="err">Fetch failed: ' + escapeHtml(String(e)) + '</div>';
  }
}

/* ---------- lab ---------- */
async function loadLab() {
  const outEl = document.getElementById("labOut");
  outEl.innerHTML = '<div class="meta">loading from GitHub…</div>';
  try {
    const listing = await (await fetch(GH_API)).json();
    const files = listing.filter(f => f.name.endsWith(".json"));
    const rows = [];
    for (const f of files) {
      try {
        const r = await (await fetch(f.download_url)).json();
        if (!r.metrics) continue;
        rows.push({
          name: r.name, dataset: r.dataset, retriever: r.retriever,
          ndcg: r.metrics.ndcg_at_10, grounding: r.metrics.answer_grounding ?? null,
          commit: (r.metadata && r.metadata.git_commit || "").slice(0, 7),
        });
      } catch (_) {}
    }
    rows.sort((a, b) => (a.dataset + a.retriever).localeCompare(b.dataset + b.retriever));
    let html = '<table><tr><th>experiment</th><th>dataset</th><th>retriever</th><th>nDCG@10</th><th>grounding</th><th>commit</th></tr>';
    for (const r of rows) {
      html += '<tr><td>' + escapeHtml(r.name) + '</td><td>' + escapeHtml(r.dataset) + '</td><td>' +
              escapeHtml(r.retriever) + '</td><td class="num">' + (r.ndcg ?? "–") + '</td><td class="num">' +
              (r.grounding ?? "–") + '</td><td class="dim">' + r.commit + '</td></tr>';
    }
    const reports = listing.filter(f => f.name.endsWith(".md"));
    if (reports.length) {
      html += '</table><div class="meta" style="margin-top:14px">Analysis reports: ';
      html += reports.map(f => '<a href="' + f.download_url + '" target="_blank">' + f.name.slice(0, 40) + '…</a>').join(" &middot; ");
      html += '</div>';
    }
    outEl.innerHTML = html;
  } catch (e) {
    outEl.innerHTML = '<div class="err">GitHub fetch failed: ' + escapeHtml(String(e)) + '</div>';
  }
}

loadChats();
</script>
</body>
</html>
