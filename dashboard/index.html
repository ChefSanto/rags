<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Lab — RAG console</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --fg:#e6e9ef; --dim:#9aa3b2; --accent:#5b9dff; --ok:#4ade80; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid #262b36; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .dim { color:var(--dim); font-size:13px; }
  nav { display:flex; gap:8px; padding:12px 24px 0; }
  nav button { background:var(--panel); color:var(--dim); border:1px solid #262b36; padding:8px 16px; border-radius:8px 8px 0 0; cursor:pointer; }
  nav button.active { color:var(--fg); border-bottom-color:var(--accent); }
  main { padding:20px 24px; }
  section { display:none; }
  section.active { display:block; }
  .panel { background:var(--panel); border:1px solid #262b36; border-radius:0 12px 12px 12px; padding:20px; }
  textarea, input[type=text] { width:100%; background:#0c0e12; color:var(--fg); border:1px solid #2c3340; border-radius:8px; padding:10px; font:inherit; }
  button.go { background:var(--accent); color:#08111f; border:0; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; margin-top:10px; }
  .answer { margin-top:16px; padding:14px; background:#0c0e12; border-left:3px solid var(--accent); border-radius:0 8px 8px 0; white-space:pre-wrap; }
  .meta { color:var(--dim); font-size:12px; margin-top:8px; }
  .src { padding:8px 10px; border:1px solid #262b36; border-radius:8px; margin-top:8px; }
  .src .id { color:var(--accent); font-size:12px; }
  .src .score { color:var(--ok); font-size:12px; float:right; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid #232834; vertical-align:top; }
  th { color:var(--dim); font-weight:600; }
  td.num { font-variant-numeric:tabular-nums; }
  a { color:var(--accent); }
  .err { color:#ff7b72; }
</style>
</head>
<body>
<header>
  <h1>AI Lab</h1>
  <span class="dim">working RAG + benchmark lab &middot; worker: <a id="workerUrl" href="#" target="_blank"></a></span>
</header>
<nav>
  <button data-tab="ask" class="active">Ask</button>
  <button data-tab="logs">Query log</button>
  <button data-tab="lab">Lab status</button>
</nav>
<main>
  <section id="ask" class="active">
    <div class="panel">
      <input type="text" id="q" placeholder="Ask about the corpus… (e.g. What is a diversified portfolio?)" onkeydown="if(event.key==='Enter')ask()">
      <button class="go" onclick="ask()">Ask</button>
      <div id="askOut"></div>
    </div>
  </section>
  <section id="logs">
    <div class="panel">
      <button class="go" onclick="loadLogs()">Refresh</button>
      <div id="logsOut"></div>
    </div>
  </section>
  <section id="lab">
    <div class="panel">
      <span class="dim">Loaded live from the GitHub repo (experiments/results). <button class="go" onclick="loadLab()">Reload</button></span>
      <div id="labOut"></div>
    </div>
  </section>
</main>
<script>
const WORKER = "https://ai-lab-worker.antwibrand.workers.dev";
const GH_API = "https://api.github.com/repos/ChefSanto/rags/contents/experiments/results";
document.getElementById("workerUrl").textContent = WORKER;
document.getElementById("workerUrl").href = WORKER + "/health";

for (const b of document.querySelectorAll("nav button")) {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll("section").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById(b.dataset.tab).classList.add("active");
    if (b.dataset.tab === "logs") loadLogs();
    if (b.dataset.tab === "lab") loadLab();
  };
}

async function ask() {
  const q = document.getElementById("q").value.trim();
  const out = document.getElementById("askOut");
  if (!q) return;
  out.innerHTML = '<div class="meta">asking…</div>';
  try {
    const r = await fetch(WORKER + "/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    const j = await r.json();
    if (!r.ok) { out.innerHTML = '<div class="answer err">Error: ' + (j.error || r.status) + '</div>'; return; }
    let html = '<div class="answer">' + escapeHtml(j.answer) + '</div>';
    html += '<div class="meta">' + j.sources.length + ' sources &middot; ' + j.elapsed_ms + ' ms</div>';
    for (const s of j.sources) {
      html += '<div class="src"><span class="score">' + (s.score ?? 0).toFixed(3) + '</span>' +
              '<span class="id">#' + escapeHtml(String(s.id)) + '</span><br>' +
              '<span class="dim">' + escapeHtml(s.preview) + '…</span></div>';
    }
    out.innerHTML = html;
  } catch (e) {
    out.innerHTML = '<div class="answer err">Fetch failed: ' + escapeHtml(String(e)) + '</div>';
  }
}

async function loadLogs() {
  const out = document.getElementById("logsOut");
  out.innerHTML = '<div class="meta">loading…</div>';
  try {
    const r = await fetch(WORKER + "/logs?limit=50");
    const j = await r.json();
    if (!j.logs || !j.logs.length) { out.innerHTML = '<div class="meta">No queries logged yet.</div>'; return; }
    let html = '<table><tr><th>#</th><th>when (UTC)</th><th>question</th><th>src</th><th>ms</th></tr>';
    for (const l of j.logs) {
      html += '<tr><td>' + l.id + '</td><td class="dim">' + l.created_at + '</td><td>' +
              escapeHtml(l.question) + '</td><td class="num">' + l.num_sources +
              '</td><td class="num">' + l.elapsed_ms + '</td></tr>';
    }
    out.innerHTML = html + '</table>';
  } catch (e) {
    out.innerHTML = '<div class="answer err">Fetch failed: ' + escapeHtml(String(e)) + '</div>';
  }
}

async function loadLab() {
  const out = document.getElementById("labOut");
  out.innerHTML = '<div class="meta">loading from GitHub…</div>';
  try {
    const listing = await (await fetch(GH_API)).json();
    const files = listing.filter(f => f.name.endsWith(".json"));
    const rows = [];
    for (const f of files) {
      try {
        const r = await (await fetch(f.download_url)).json();
        if (!r.metrics) continue;
        rows.push({
          name: r.name, dataset: r.dataset, retriever: r.retriever,
          ndcg: r.metrics.ndcg_at_10, grounding: r.metrics.answer_grounding ?? null,
          commit: (r.metadata && r.metadata.git_commit || "").slice(0, 7),
        });
      } catch (_) { /* skip unreadable */ }
    }
    rows.sort((a, b) => (a.dataset + a.retriever).localeCompare(b.dataset + b.retriever));
    let html = '<table><tr><th>experiment</th><th>dataset</th><th>retriever</th><th>nDCG@10</th><th>grounding</th><th>commit</th></tr>';
    for (const r of rows) {
      html += '<tr><td>' + escapeHtml(r.name) + '</td><td>' + escapeHtml(r.dataset) + '</td><td>' +
              escapeHtml(r.retriever) + '</td><td class="num">' + (r.ndcg ?? "–") + '</td><td class="num">' +
              (r.grounding ?? "–") + '</td><td class="dim">' + r.commit + '</td></tr>';
    }
    const reports = listing.filter(f => f.name.endsWith(".md"));
    if (reports.length) {
      html += '</table><div class="meta" style="margin-top:14px">Analysis reports: ';
      html += reports.map(f => '<a href="' + f.download_url + '" target="_blank">' + f.name.slice(0, 40) + '…</a>').join(" &middot; ");
      html += '</div>';
    }
    out.innerHTML = html;
  } catch (e) {
    out.innerHTML = '<div class="answer err">GitHub fetch failed: ' + escapeHtml(String(e)) + '</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
</script>
</body>
</html>
