[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lab"
version = "0.1.0"
description = "Reproducible experimentation platform for RAG research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.7",
    "torch>=2.0",
]
pdf = [
    "pymupdf>=1.24",
]
router = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.ruff]
line-length = 100
target-version = "py310"
